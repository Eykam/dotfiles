[[language]]
name = "python"

[language.debugger]
name = "debugpy"
transport = "stdio"
command = "python"
args = ["-m", "debugpy.adapter"]

[[language.debugger.templates]]
name = "source"
request = "launch"
completion = [ { name = "entrypoint", completion = "filename", default = "." } ]
args = { mode = "debug", program = "{0}" }

[[language.debugger.templates]]
name = "current-file"
request = "launch"
args = { mode = "debug", program = "{0}", justMyCode = false }

[[language.debugger.templates]]
name = "pytest"
request = "launch"
args = { mode = "debug", module = "pytest", args = ["{0}"], justMyCode = false }

[[language.debugger.templates]]
name = "pytest-file"
request = "launch"
args = { mode = "debug", module = "pytest", args = ["{0}", "-xvs"], justMyCode = false }

[[language.debugger.templates]]
name = "pytest-tests-folder"
request = "launch"
args = { mode = "debug", module = "pytest", args = ["tests", "-xvs"], justMyCode = false }

[[language.debugger.templates]]
name = "attach"
request = "attach"
completion = [ "pid" ]
args = { mode = "debug", processId = "{0}" }
